name: tradetwin

x-backend-health: &backend-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
  interval: 10s
  timeout: 8s
  start_period: 60s
  retries: 6

services:
  web:
    build:
      context: ./apps/web
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      compliance-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      intelligence-service:
        condition: service_healthy

  api:
    healthcheck:
      <<: *backend-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
    build:
      context: ./apps/api
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  shipment-service:
    healthcheck: *backend-health
    build:
      context: .
      dockerfile: services/shipment-service/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${SHIPMENT_SERVICE_PORT:-8011}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  compliance-service:
    healthcheck: *backend-health
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${COMPLIANCE_SERVICE_PORT:-8012}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      shipment-service:
        condition: service_healthy
      document-service:
        condition: service_healthy

  document-service:
    healthcheck: *backend-health
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    environment:
      DOCUMENT_ENCRYPTION_KEY_FILE: /run/secrets/document-keyring.json
    volumes:
      - type: bind
        source: ./.secrets/document-keyring.json
        target: /run/secrets/document-keyring.json
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${DOCUMENT_SERVICE_PORT:-8013}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  intelligence-service:
    healthcheck: *backend-health
    build:
      context: .
      dockerfile: services/intelligence-service/Dockerfile
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${INTELLIGENCE_SERVICE_PORT:-8014}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      shipment-service:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/123456789}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data

  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tradetwin-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-123456789}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  neo4j-data:
  redis-data:
  minio-data:
