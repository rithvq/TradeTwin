[tool.pytest.ini_options]
testpaths = [
  "apps/api",
  "services/shipment-service",
  "services/compliance-service",
  "services/document-service",
  "services/intelligence-service",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
