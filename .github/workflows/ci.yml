name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      commercial-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trade_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-test-only
          POSTGRES_DB: trade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trade_test -d trade_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          python scripts/init-document-key.py
          docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/security -r apps/api/requirements.txt -r services/shipment-service/requirements.txt -r services/compliance-service/requirements.txt -r services/document-service/requirements.txt -r services/intelligence-service/requirements.txt
          python -m pip check

      - name: Lint
        run: |
          ruff check apps/api services packages scripts conftest.py
          ruff format --check apps/api services packages scripts conftest.py
          python scripts/check-architecture.py

      - name: Test
        run: pytest apps/api services/shipment-service services/compliance-service services/document-service services/intelligence-service

      - name: PostgreSQL commercial acceptance and concurrency
        env:
          TRADE_TEST_DATABASE_URL: postgresql+psycopg://trade_test:${{ github.run_id }}-test-only@127.0.0.1:5432/trade_test
        run: >-
          pytest services/shipment-service/tests/test_trade_migrations.py
          services/shipment-service/tests/test_commercial_agreements.py
          services/shipment-service/tests/test_operations.py
          services/shipment-service/tests/test_document_desk.py
          services/shipment-service/tests/test_dispatch_policy.py
          services/shipment-service/tests/test_freight_planning.py
          services/shipment-service/tests/test_corridor_intelligence.py
          services/shipment-service/tests/test_product_integration.py
          services/shipment-service/tests/test_selective_compliance.py

      - name: Corridor intelligence contract drift
        run: |
          python scripts/export-corridor-contracts.py
          git diff --exit-code -- docs/postman

      - name: Product integration contract drift
        run: |
          python scripts/export-product-contracts.py
          git diff --exit-code -- docs/postman
          pytest scripts/test_contract_schema.py

      - name: Freight planning contract drift
        run: |
          python scripts/export-freight-contracts.py
          git diff --exit-code -- docs/postman

      - name: Guarded dispatch contract drift
        run: |
          python -c "import pydantic; print('Pydantic schema generator:', pydantic.__version__)"
          python scripts/export-dispatch-contracts.py
          git diff --exit-code -- docs/postman

      - name: Service integration walkthrough
        run: python scripts/smoke-test.py --local

      - name: Profile isolation integration
        run: python scripts/profile-security-check.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint frontend
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
          npm run check:architecture

      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Test frontend
        working-directory: apps/web
        run: npm test

      - name: Set up browser-test Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install authenticated walkthrough dependencies
        run: |
          python -m pip install -e packages/security -r apps/api/requirements.txt -r services/shipment-service/requirements.txt -r services/compliance-service/requirements.txt -r services/document-service/requirements.txt -r services/intelligence-service/requirements.txt -r scripts/requirements-browser.txt
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Commercial browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: python scripts/commercial-browser-check.py

      - name: Operational browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: python scripts/operations-browser-check.py

      - name: Document desk browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: python scripts/document-browser-check.py

      - name: Guarded dispatch browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: python scripts/dispatch-browser-check.py

      - name: Freight planning browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: python scripts/freight-browser-check.py

      - name: Product integration browser acceptance
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: python scripts/product-browser-check.py
